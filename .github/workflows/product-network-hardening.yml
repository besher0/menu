name: Product Network Hardening

on:
  push:
    branches:
      - refactor/product-network-production-hardening
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: product-network-hardening-${{ github.ref }}
  cancel-in-progress: false

env:
  DATABASE_URL: postgresql://test:test@localhost:5432/test?schema=public
  DIRECT_URL: postgresql://test:test@localhost:5432/test?schema=public

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate Prisma schema
        run: npx prisma validate --schema apps/api/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test?schema=public
      - name: Generate Prisma client
        run: npm run prisma:generate
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test?schema=public
      # Always replay the full committed migration history from an EMPTY
      # PostgreSQL 16 fixture. db push is not a substitute for migrate deploy.
      - name: Replay migrations from zero on disposable PostgreSQL
        run: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma
      - name: Check migration status on disposable PostgreSQL
        run: npx prisma migrate status --schema apps/api/prisma/schema.prisma
      # Prisma v5 diff exit code: 0 = same schema, 2 = drift.
      # A nonzero result blocks release; never auto-apply db push.
      - name: Ensure migrated database matches current Prisma schema
        run: npx prisma migrate diff --from-url "$DIRECT_URL" --to-schema-datamodel apps/api/prisma/schema.prisma --exit-code
      - name: Typecheck
        run: npm run typecheck
      - name: Shared tests
        run: npm run test:shared
      - name: API unit tests
        run: npm run test:api
      - name: Web component tests
        run: npm run test -w @menu/web
      - name: Production builds
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_API_URL: http://localhost:5000

  network-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ordersawa_stage3_stage6c_ci
        ports:
          - 55440:5432
        options: >-
          --health-cmd "pg_isready -U test -d ordersawa_stage3_stage6c_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://test:test@127.0.0.1:55440/ordersawa_stage3_stage6c_ci?schema=public
      DIRECT_URL: postgresql://test:test@127.0.0.1:55440/ordersawa_stage3_stage6c_ci?schema=public
      NETWORK_ORDER_TEST_DATABASE_URL: postgresql://test:test@127.0.0.1:55440/ordersawa_stage3_stage6c_ci?schema=public
      ENABLE_DISPOSABLE_NETWORK_ORDERS: '1'
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run prisma:generate
      - name: Replay actual migrations on disposable network integration database
        run: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma
      - name: Install exact disposable Stage 6D completeness guard
        run: npx prisma db execute --file scripts/stage6d3c3e-network-order-completeness-candidate.sql --schema apps/api/prisma/schema.prisma
      - name: Verify expected disposable DB guard via unit assertions
        run: npm run test -w @menu/api -- src/modules/orders/network-order-db-guard.spec.ts
      - name: Build shared package for integration imports
        run: npm run build -w @menu/shared
      - name: Stage 6C real PostgreSQL integration tests
        run: npm exec --workspace @menu/api -- vitest run src/modules/orders/network-orders.integration.spec.ts


  atomic-integration:
    # Independent runner: disposable PG16, server really bound to loopback :55440.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NODE_ENV: test
      ENABLE_DISPOSABLE_NETWORK_ORDERS: '1'
      DATABASE_URL: postgresql://test:test@127.0.0.1:55440/ordersawa_stage3_stage6c_stage6d3c3f_atomic?schema=public
      DIRECT_URL: postgresql://test:test@127.0.0.1:55440/ordersawa_stage3_stage6c_stage6d3c3f_atomic?schema=public
      NETWORK_ORDER_ATOMIC_TEST_DATABASE_URL: postgresql://test:test@127.0.0.1:55440/ordersawa_stage3_stage6c_stage6d3c3f_atomic?schema=public
      NETWORK_ORDER_NO_GUARD_TEST_DATABASE_URL: postgresql://test:test@127.0.0.1:55440/ordersawa_stage3_stage6c_stage6d3c3f_no_guard?schema=public
      NETWORK_ORDER_FAKE_GUARD_TEST_DATABASE_URL: postgresql://test:test@127.0.0.1:55440/ordersawa_stage3_stage6c_stage6d3c3f_fake_guard?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Start loopback-only PostgreSQL 16 instance
        run: |
          docker run --rm -d --name ordersawa-atomic-ci-pg --network host \
            -e POSTGRES_USER=test -e POSTGRES_PASSWORD=test \
            -e POSTGRES_DB=ordersawa_stage3_stage6c_stage6d3c3f_atomic \
            postgres:16 -c listen_addresses=127.0.0.1 -c port=55440
          for i in $(seq 1 45); do
            if docker exec ordersawa-atomic-ci-pg pg_isready -h 127.0.0.1 -p 55440 -U test \
              -d ordersawa_stage3_stage6c_stage6d3c3f_atomic >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec ordersawa-atomic-ci-pg pg_isready -h 127.0.0.1 -p 55440 -U test \
            -d ordersawa_stage3_stage6c_stage6d3c3f_atomic
          actual=$(docker exec -e PGPASSWORD=test ordersawa-atomic-ci-pg \
            psql -h 127.0.0.1 -p 55440 -U test -d ordersawa_stage3_stage6c_stage6d3c3f_atomic -tAX \
              -c "SELECT current_database() || '|' || current_user || '|' || host(inet_server_addr()) || '|' || inet_server_port() || '|' || current_setting('server_version_num')")
          case "$actual" in
            'ordersawa_stage3_stage6c_stage6d3c3f_atomic|test|127.0.0.1|55440|16'*) ;;
            *) echo "Unexpected disposable PostgreSQL identity" >&2; exit 1 ;;
          esac
          docker exec -e PGPASSWORD=test ordersawa-atomic-ci-pg psql -h 127.0.0.1 -p 55440 \
            -U test -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE "ordersawa_stage3_stage6c_stage6d3c3f_no_guard"'
          docker exec -e PGPASSWORD=test ordersawa-atomic-ci-pg psql -h 127.0.0.1 -p 55440 \
            -U test -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE "ordersawa_stage3_stage6c_stage6d3c3f_fake_guard"'
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run prisma:generate
      - name: Replay migrations on three distinct empty databases
        run: |
          for name in ordersawa_stage3_stage6c_stage6d3c3f_atomic \
            ordersawa_stage3_stage6c_stage6d3c3f_no_guard \
            ordersawa_stage3_stage6c_stage6d3c3f_fake_guard; do
            export DATABASE_URL="postgresql://test:test@127.0.0.1:55440/$name?schema=public"
            export DIRECT_URL="$DATABASE_URL"
            npx prisma migrate deploy --schema apps/api/prisma/schema.prisma
          done
      - name: Install correct guard on guarded atomic fixture ONLY
        run: npx prisma db execute --file scripts/stage6d3c3e-network-order-completeness-candidate.sql --schema apps/api/prisma/schema.prisma
      - name: Install counterfeit guard on fake fixture ONLY
        env:
          DATABASE_URL: postgresql://test:test@127.0.0.1:55440/ordersawa_stage3_stage6c_stage6d3c3f_fake_guard?schema=public
          DIRECT_URL: postgresql://test:test@127.0.0.1:55440/ordersawa_stage3_stage6c_stage6d3c3f_fake_guard?schema=public
        run: npx prisma db execute --file scripts/stage6d3c3f-fake-guard-ci.sql --schema apps/api/prisma/schema.prisma
      - name: Build shared package
        run: npm run build -w @menu/shared
      - name: Atomic HTTP concurrency and rollback integration
        run: npm exec --workspace @menu/api -- vitest run src/modules/orders/network-orders-atomic.integration.spec.ts --testTimeout 120000 --hookTimeout 180000
      - name: Stop disposable PostgreSQL
        if: always()
        run: docker stop ordersawa-atomic-ci-pg || true
