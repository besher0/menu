name: Product Network Hardening

on:
  push:
    branches:
      - refactor/product-network-production-hardening
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: product-network-hardening-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://test:test@localhost:5432/test?schema=public
  DIRECT_URL: postgresql://test:test@localhost:5432/test?schema=public

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate Prisma schema
        run: npx prisma validate --schema apps/api/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test?schema=public
      - name: Generate Prisma client
        run: npm run prisma:generate
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test?schema=public
      # This repository's migration history starts after the original baseline.
      # migrate deploy on a blank DB fails with 42P01 (Category missing).
      # Validate the complete current schema against a disposable DB instead;
      # migration replay on a restored baseline remains a separate release gate.
      - name: Validate current schema on disposable PostgreSQL
        run: npx prisma db push --schema apps/api/prisma/schema.prisma --accept-data-loss
      - name: Typecheck
        run: npm run typecheck
      - name: Shared tests
        run: npm run test:shared
      - name: API unit tests
        run: npm run test:api
      - name: Web component tests
        run: npm run test -w @menu/web
      - name: Production builds
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_API_URL: http://localhost:5000
