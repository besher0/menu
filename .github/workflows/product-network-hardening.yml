name: Product Network Hardening

on:
  push:
    branches:
      - refactor/product-network-production-hardening
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: product-network-hardening-${{ github.ref }}
  cancel-in-progress: false

env:
  DATABASE_URL: postgresql://test:test@localhost:5432/test?schema=public
  DIRECT_URL: postgresql://test:test@localhost:5432/test?schema=public

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate Prisma schema
        run: npx prisma validate --schema apps/api/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test?schema=public
      - name: Generate Prisma client
        run: npm run prisma:generate
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test?schema=public
      # Always replay the full committed migration history from an EMPTY
      # PostgreSQL 16 fixture. db push is not a substitute for migrate deploy.
      - name: Replay migrations from zero on disposable PostgreSQL
        run: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma
      - name: Check migration status on disposable PostgreSQL
        run: npx prisma migrate status --schema apps/api/prisma/schema.prisma
      # Prisma v5 diff exit code: 0 = same schema, 2 = drift.
      # A nonzero result blocks release; never auto-apply db push.
      - name: Ensure migrated database matches current Prisma schema
        run: npx prisma migrate diff --from-url "$DIRECT_URL" --to-schema-datamodel apps/api/prisma/schema.prisma --exit-code
      - name: Typecheck
        run: npm run typecheck
      - name: Shared tests
        run: npm run test:shared
      - name: API unit tests
        run: npm run test:api
      - name: Web component tests
        run: npm run test -w @menu/web
      - name: Production builds
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_API_URL: http://localhost:5000

  network-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ordersawa_stage3_stage6c_ci
        ports:
          - 55440:5432
        options: >-
          --health-cmd "pg_isready -U test -d ordersawa_stage3_stage6c_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://test:test@127.0.0.1:55440/ordersawa_stage3_stage6c_ci?schema=public
      DIRECT_URL: postgresql://test:test@127.0.0.1:55440/ordersawa_stage3_stage6c_ci?schema=public
      NETWORK_ORDER_TEST_DATABASE_URL: postgresql://test:test@127.0.0.1:55440/ordersawa_stage3_stage6c_ci?schema=public
      ENABLE_DISPOSABLE_NETWORK_ORDERS: '1'
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run prisma:generate
      - name: Create disposable integration schema
        run: npx prisma db push --schema apps/api/prisma/schema.prisma --accept-data-loss
      - name: Build shared package for integration imports
        run: npm run build -w @menu/shared
      - name: Stage 6C real PostgreSQL integration tests
        run: npm exec --workspace @menu/api -- vitest run src/modules/orders/network-orders.integration.spec.ts
